name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: user-service/gradle/wrapper/gradle-wrapper.properties
      - name: Grant Gradle wrapper permissions
        run: chmod +x gradlew
      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: user-service/gradle/wrapper/gradle-wrapper.properties
      - name: Grant Gradle wrapper permissions
        run: chmod +x gradlew
      - name: Start Postgres and apply migrations
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm liquibase
      - name: Build and test
        run: ./gradlew test --no-daemon
        env:
          JOOQ_JDBC_URL: jdbc:postgresql://localhost:5432/user_service
          JOOQ_JDBC_USER: user_service_app
          JOOQ_JDBC_PASSWORD: user_service_app
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: user-service/build/reports/tests/test/
